el=el('text',{x:28,y:445,class:'scene-muted'});label.textContent=state.view==='top'?'俯视 XY':'可拖动 3D 投影';svg.appendChild(label);const m=DATA[kind==='accepted'?'accepted':'rejected'].metrics;const status=el('text',{x:28,y:466,class:'scene-text'});status.textContent=(m.accepted?'门禁 accepted':'门禁 rejected')+' · p90 '+m.p90.toFixed(1)+' mm '+(m.accepted?' < 40 mm':' < 40 mm，但触发歧义');svg.appendChild(status);const detail=el('text',{x:28,y:486,class:'scene-muted'});detail.textContent=kind==='accepted'?'outer/inner 候选 p90 = '+m.outerP90.toFixed(1)+' / '+m.innerP90.toFixed(1)+' mm':'outer/inner 候选 p90 = '+m.outerP90.toFixed(2)+' / '+m.innerP90.toFixed(2)+' mm（差 '+Math.abs(m.outerP90-m.innerP90).toFixed(2)+' mm）';svg.appendChild(detail);}
  function render(){const b=basis();drawPanel(root.querySelector('#r1-accepted-panel'),A,DATA.accepted,'accepted');drawPanel(root.querySelector('#r1-rejected-panel'),R,DATA.rejected,'rejected');root.querySelector('#r1-compare-summary').textContent='D03 的最佳拟合 p90 只有 17.9 mm，本身低于 40 mm 残差阈值；但 outer+rim 与 inner+rim 的 p90 分别为 18.57 / 18.52 mm，几乎不可区分，所以 R1 保守地拒绝。D05 两种解释的分数差异足够大，接受。';}
  root.querySelectorAll('[data-view]').forEach(btn=>btn.addEventListener('click',()=>{state.view=btn.getAttribute('data-view');root.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b===btn?'true':'false'));render();}));
  root.querySelector('[data-alt]').addEventListener('click',()=>{state.showAlt=!state.showAlt;root.querySelector('[data-alt]').setAttribute('aria-pressed',state.showAlt?'true':'false');render();});
  root.querySelectorAll('svg').forEach(svg=>{svg.addEventListener('pointerdown',e=>{if(state.view!=='oblique')return;state.dragging=true;state.px=e.clientX;state.py=e.clientY;svg.setPointerCapture(e.pointerId);});svg.addEventListener('pointermove',e=>{if(!state.dragging)return;state.az+=(e.clientX-state.px)*.008;state.el=Math.max(-1.05,Math.min(1.05,state.el+(e.clientY-state.py)*.008));state.px=e.clientX;state.py=e.clientY;render();});svg.addEventListener('pointerup',()=>state.dragging=false);svg.addEventListener('pointercancel',()=>state.dragging=false);});
  render();
})();
</script>
