    <div class="text-muted">候选重定位参数</div>
    <div class="viz-stat-value" id="r8-pose-text"></div>
    <code id="r8-command"></code>
  </div>
</div>

<style>
#room0804-pose-picker { color: var(--foreground); }
#room0804-pose-picker .viz-controls { margin-block: 10px; }
#room0804-pose-picker .form-label { min-width: 145px; }
#room0804-pose-picker .r8-map-shell { width: 100%; }
#room0804-pose-picker #r8-map { display: block; width: 100%; height: auto; cursor: crosshair; background: var(--muted); }
#room0804-pose-picker #r8-grid line { stroke: var(--border); stroke-width: 1; vector-effect: non-scaling-stroke; opacity: .65; }
#room0804-pose-picker #r8-grid text { fill: var(--foreground); font-size: 11px; paint-order: stroke; stroke: var(--background); stroke-width: 3px; stroke-linejoin: round; }
#room0804-pose-picker #r8-last circle { fill: var(--viz-series-2); stroke: var(--background); stroke-width: 2; vector-effect: non-scaling-stroke; }
#room0804-pose-picker #r8-last line { stroke: var(--viz-series-2); stroke-width: 3; vector-effect: non-scaling-stroke; }
#room0804-pose-picker #r8-failed path { stroke: var(--destructive); stroke-width: 3; vector-effect: non-scaling-stroke; }
#room0804-pose-picker #r8-selected circle { fill: var(--viz-series-1); stroke: var(--background); stroke-width: 2; vector-effect: non-scaling-stroke; }
#room0804-pose-picker #r8-selected line,
#room0804-pose-picker #r8-selected path { stroke: var(--viz-series-1); stroke-width: 3; fill: none; vector-effect: non-scaling-stroke; }
#room0804-pose-picker .r8-legend { margin-block: 8px; gap: 18px; }
#room0804-pose-picker .r8-legend span { display: inline-flex; align-items: center; gap: 6px; }
#room0804-pose-picker .r8-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
#room0804-pose-picker .r8-trusted { background: var(--viz-series-2); }
#room0804-pose-picker .r8-current { background: var(--viz-series-1); }
#room0804-pose-picker .r8-cross { color: var(--destructive); font-size: 18px; }
#room0804-pose-picker .r8-result { margin-top: 8px; }
#room0804-pose-picker .r8-result code { display: block; margin-top: 6px; overflow-wrap: anywhere; }
@media (max-width: 480px) {
  #room0804-pose-picker #r8-grid text { display: none; }
  #room0804-pose-picker .form-label { min-width: 100%; }
}
</style>

<script>
(() => {
  const root = document.getElementById('room0804-pose-picker');
  const svg = root.querySelector('#r8-map');
  const hit = root.querySelector('#r8-hit');
  const grid = root.querySelector('#r8-grid');
  const selected = root.querySelector('#r8-selected');
  const heading = root.querySelector('#r8-heading');
  const arrow = root.querySelector('#r8-arrow');
  const last = root.querySelector('#r8-last');
  const failed = root.querySelector('#r8-failed');
  const xInput = root.querySelector('#r8-x');
  const yInput = root.querySelector('#r8-y');
  const yawInput = root.querySelector('#r8-yaw');
  const poseText = root.querySelector('#r8-pose-text');
  const command = root.querySelector('#r8-command');

  const originX = -3.70319;
  const originY = -6.71105;
  const resolution = 0.05;
  const width = 800;
  const height = 220;
  const ns = 'http://www.w3.org/2000/svg';

  function mapToPixel(x, y) {
    return [(x - originX) / resolution, height - (y - originY) / resolution];
  }

  function pixelToMap(px, py) {
    return [originX + px * resolution, originY + (height - py) * resolution];
  }

  function addGridLine(x1, y1, x2, y2, label, tx, ty) {
    const line = document.createElementNS(ns, 'line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    grid.appendChild(line);
    const text = document.createElementNS(ns, 'text');
    text.setAttribute('x', tx); text.setAttribute('y', ty);
    text.textContent = label;
    grid.appendChild(text);
  }

  for (let x = 0; x <= 35; x += 5) {
    const px = mapToPixel(x, 0)[0];
    if (px >= 0 && px <= width) addGridLine(px, 0, px, height, 'x=' + x, px + 3, 13);
  }
  for (let y = -6; y <= 4; y += 2) {
    const py = mapToPixel(0, y)[1];
    if (py >= 0 && py <= height) addGridLine(0, py, width, py, 'y=' + y, 3, py - 4);
  }

  function setTransform(group, x, y, yaw, withHeading) {
    const p = mapToPixel(x, y);
    group.setAttribute('transform', 'translate(' + p[0] + ' ' + p[1] + ')');
    if (withHeading) {
      const degrees = -yaw * 180 / Math.PI;
      heading.setAttribute('transform', 'rotate(' + degrees + ')');
      arrow.setAttribute('transform', 'rotate(' + degrees + ')');
    }
  }

  setTransform(last, 1.01397, -0.0760396, -0.160, false);
  last.querySelector('line').setAttribute('transform', 'rotate(' + (0.160 * 180 / Math.PI) + ')');
  setTransform(failed, 0.2, -0.2, -0.5, false);

  function update() {
    let x = Number(xInput.value);
    let y = Number(yInput.value);
    let yaw = Number(yawInput.value);
    if (!Number.isFinite(x)) x = 0;
    if (!Number.isFinite(y)) y = 0;
    if (!Number.isFinite(yaw)) yaw = 0;
    yaw = Math.max(-Math.PI, Math.min(Math.PI, yaw));
    yawInput.value = yaw.toFixed(3);
    setTransform(selected, x, y, yaw, true);
    poseText.textContent = 'x=' + x.toFixed(3) + ' m, y=' + y.toFixed(3) + ' m, yaw=' + yaw.toFixed(3) + ' rad';
    command.textContent = 'relocalize --x ' + x.toFixed(3) + ' --y ' + y.toFixed(3) + ' --yaw ' + yaw.toFixed(3);
  }

  hit.addEventListener('click', event => {
    const point = svg.createSVGPoint();
    point.x = event.clientX; point.y = event.clientY;
    const local = point.matrixTransform(svg.getScreenCTM().inverse());
    const map = pixelToMap(local.x, local.y);
    xInput.value = map[0].toFixed(3);
    yInput.value = map[1].toFixed(3);
    update();
  });
  [xInput, yInput, yawInput].forEach(input => input.addEventListener('input', update));
  update();
})();
</script>
