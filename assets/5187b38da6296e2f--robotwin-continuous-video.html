  <script>
  (() => {
    const root=document.getElementById('robotwin-continuous-video');
    const data=JSON.parse(root.querySelector('#rw-full-video-data').textContent);
    const get=name=>root.querySelector('[data-role="'+name+'"]');
    const videos=[get('clean'),get('randomized')],task=get('task'),speed=get('speed'),button=get('play');
    let selected=2,rate=0.5;
    function restore(state){const s=state?.privateContent;if(Number.isInteger(s?.task)&&s.task>=0&&s.task<3)selected=s.task;if([0.5,1,2].includes(s?.speed))rate=s.speed;}
    restore(window.openai?.widgetState);
    function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{task:data[selected].task,episode:0,view:'complete continuous videos',speed:rate},privateContent:{task:selected,speed:rate}}).catch(()=>{});}
    function times(){['clean','randomized'].forEach((name,i)=>{const v=videos[i],entry=data[selected].settings[name];get(name+'-time').textContent=`${v.currentTime.toFixed(1)} / ${entry.duration.toFixed(1)} s · ${entry.frames} 帧`;});button.textContent=videos.some(v=>!v.paused&&!v.ended)?'暂停两侧':'播放两侧';}
    function load(){videos.forEach(v=>v.pause());task.value=selected;speed.value=rate;['clean','randomized'].forEach((name,i)=>{videos[i].src=data[selected].settings[name].video;videos[i].defaultPlaybackRate=rate;videos[i].playbackRate=rate;videos[i].load();});get('status').textContent=data[selected].title+' · 原始数据集完整演示录像';times();}
    async function play(){const result=await Promise.allSettled(videos.map(v=>v.play()));if(result.some(r=>r.status==='rejected'))get('status').textContent='请点击各视频自带的播放按钮';times();}
    button.addEventListener('click',()=>{if(videos.some(v=>!v.paused&&!v.ended))videos.forEach(v=>v.pause());else {videos.forEach(v=>{if(v.ended)v.currentTime=0;});play();}times();});
    get('restart').addEventListener('click',()=>{videos.forEach(v=>v.currentTime=0);play();});
    task.addEventListener('change',()=>{selected=Number(task.value);load();save();});
    speed.addEventListener('change',()=>{rate=Number(speed.value);videos.forEach(v=>v.playbackRate=rate);save();});
    videos.forEach(v=>{['timeupdate','play','pause','ended','loadedmetadata'].forEach(event=>v.addEventListener(event,times));v.addEventListener('error',()=>{get('status').textContent='视频解码失败，请打开本地原始 MP4 查看';});});
    window.addEventListener('openai:set_globals',event=>{restore(event.detail?.globals?.widgetState);load();});
    load();
  })();
  </script>
