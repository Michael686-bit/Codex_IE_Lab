        [[-14,'实测外底 −14'],[0,'板印刷面 0'],[158,'实测最高点 158'],[modelBottom,`模型外底 ${modelBottom.toFixed(1)}`],[modelTop,`模型最高 ${modelTop.toFixed(1)}`]].forEach(([z,label])=>{const xx=map(z);element('line',{x1:xx,x2:xx,y1:y+27,y2:y+66,class:'mbb-height-line'});const t=element('text',{x:xx,y:y+14,class:'mbb-height-text','text-anchor':'middle'});t.textContent=label;});
        const t1=element('text',{x:x+8,y:y+28,class:'mbb-height-text'});t1.textContent='模型/黄框'; const t2=element('text',{x:x+8,y:y+45,class:'mbb-height-text'});t2.textContent='黄框底'; const t3=element('text',{x:x+8,y:y+62,class:'mbb-height-text'});t3.textContent='实测';
        const t4=element('text',{x:x+w-10,y:y+14,class:'mbb-height-text','text-anchor':'end'});t4.textContent='实测：外高 172 mm，内底面至最高点 160 mm，板印刷面至最高点 158 mm';
      };
      const render = () => {
        clear(scene);
        Object.values(panels).forEach((panel)=>{drawPanelFrame(panel);const frame=frameFor(panel);if(state.mesh)drawMesh(panel,frame);if(state.cube)drawCube(panel,frame);if(state.board){drawBoard(panel,frame);drawAxes(panel,frame);}drawNotch(panel,frame);});
        drawHeightStrip();
        detail.textContent=`mesh ${data.metrics.mesh_semantic_extents_mm.map(x=>x.toFixed(3)).join('×')} mm | 板印刷面 0 mm | 板下表面 −2.000 mm | 缺角下边 ${data.metrics.notch_edge_mm.map(x=>x.toFixed(3)).join(' / ')} mm | R03角点 ${data.metrics.r03_corners}，RMSE ${data.metrics.r03_rmse_px.toFixed(3)} px`;
      };
      root.querySelector('[data-reset]').addEventListener('click',()=>{state.yaw=-.75;state.pitch=.55;state.zoom=1;render();});
      root.querySelectorAll('[data-toggle]').forEach((button)=>button.addEventListener('click',()=>{const key=button.dataset.toggle;state[key]=!state[key];button.setAttribute('aria-pressed',String(state[key]));render();}));
      const dragTarget=svg;dragTarget.addEventListener('pointerdown',(event)=>{state.dragging=true;state.lastX=event.clientX;state.lastY=event.clientY;dragTarget.setPointerCapture(event.pointerId);});
      dragTarget.addEventListener('pointermove',(event)=>{if(!state.dragging)return;state.yaw-=(event.clientX-state.lastX)*.008;state.pitch=Math.max(-1.35,Math.min(1.35,state.pitch+(event.clientY-state.lastY)*.008));state.lastX=event.clientX;state.lastY=event.clientY;render();});
      dragTarget.addEventListener('pointerup',(event)=>{state.dragging=false;dragTarget.releasePointerCapture(event.pointerId);});dragTarget.addEventListener('pointercancel',()=>{state.dragging=false;});
      dragTarget.addEventListener('wheel',(event)=>{event.preventDefault();state.zoom=Math.max(.55,Math.min(2.5,state.zoom*Math.exp(-event.deltaY*.001)));render();},{passive:false});
      render();
    })();
  </script>
</div>
