<div id="vlaGpuMemory" class="vla-gpu-memory" role="group" aria-label="VLA 模型显存需求和 GPU 采购建议">
  <h2>VLA 模型显存需求与 GPU 建议</h2>
  <p class="text-small text-muted">单卡显存估算（GB）。箭头表示“至少/上限未给出”；* 表示原表保留的估算值或待进一步核验。</p>

  <div class="viz-controls" aria-label="显示的训练阶段">
    <button type="button" aria-pressed="true" data-mode="infer"><span class="legend-swatch" data-color="infer" aria-hidden="true"></span>推理 / 使用</button>
    <button type="button" aria-pressed="true" data-mode="lora"><span class="legend-swatch" data-color="lora" aria-hidden="true"></span>LoRA / PEFT</button>
    <button type="button" aria-pressed="true" data-mode="official"><span class="legend-swatch" data-color="official" aria-hidden="true"></span>常规 / 官方微调</button>
    <button type="button" aria-pressed="true" data-mode="full"><span class="legend-swatch" data-color="full" aria-hidden="true"></span>全参微调</button>
  </div>

  <div class="chart-wrap">
    <svg class="vla-memory-chart" role="img" aria-label="各 VLA 模型在不同使用阶段的单卡显存估算，横轴单位为 GB"></svg>
  </div>

  <div class="recommendations" aria-label="GPU 采购建议">
    <div><span>ACT</span><strong>4090（24GB）已足够</strong></div>
    <div><span>SmolVLA</span><strong>4090（24GB）</strong></div>
    <div><span>π0.5</span><strong>80GB+</strong></div>
    <div><span>LingBot-VLA 2.0</span><strong>4×80/96GB</strong></div>
    <div><span>π0.7</span><strong>暂不采购</strong></div>
    <div><span>UniFoLM-VLA-0</span><strong>4×80/96GB（推理 48GB）</strong></div>
  </div>
  <div id="vlaMemoryStatus" class="sr-only" aria-live="polite">当前显示全部阶段。</div>

  <style>
    #vlaGpuMemory {
      color: var(--foreground);
      font-size: var(--font-size-base);
      width: 100%;
    }
    #vlaGpuMemory h2 {
      margin: 0 0 4px;
      font-weight: 500;
    }
    #vlaGpuMemory p {
      margin: 0 0 12px;
    }
    #vlaGpuMemory .viz-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 16px;
      align-items: center;
      margin: 0 0 8px;
    }
    #vlaGpuMemory .viz-controls button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 0;
      margin: 0;
      border: 0;
      background: transparent;
      color: var(--foreground);
      font: inherit;
      cursor: pointer;
    }
    #vlaGpuMemory .viz-controls button[aria-pressed="false"] {
      color: var(--muted-foreground);
      text-decoration: line-through;
    }
    #vlaGpuMemory .legend-swatch {
      display: inline-block;
      width: 12px;
      height: 12px;
      background: var(--viz-series-1);
    }
    #vlaGpuMemory .legend-swatch[data-color="lora"] { background: var(--viz-series-2); }
    #vlaGpuMemory .legend-swatch[data-color="official"] { background: var(--viz-series-3); }
    #vlaGpuMemory .legend-swatch[data-color="full"] { background: var(--viz-series-4); }
    #vlaGpuMemory .chart-wrap {
      width: 100%;
    }
    #vlaGpuMemory svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }
    #vlaGpuMemory svg text {
      fill: var(--foreground);
      font-size: 12px;
    }
    #vlaGpuMemory svg .grid line {
      stroke: var(--border);
      stroke-width: 1;
      opacity: 0.55;
    }
    #vlaGpuMemory svg .axis path,
    #vlaGpuMemory svg .axis line,
    #vlaGpuMemory svg rect[data-chart-frame] {
      stroke: var(--border);
      stroke-width: 1;
      fill: none;
    }
    #vlaGpuMemory svg .axis text,
    #vlaGpuMemory svg .axis-title,
    #vlaGpuMemory svg .mode-label {
      fill: var(--muted-foreground);
      font-size: 11px;
    }
    #vlaGpuMemory svg .model-label {
      fill: var(--foreground);
      font-size: 12px;
    }
    #vlaGpuMemory svg .bar {
      stroke: none;
      shape-rendering: crispEdges;
    }
    #vlaGpuMemory svg .bar.open-right {
      opacity: 0.28;
    }
    #vlaGpuMemory svg .open-arrow {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
    }
    #vlaGpuMemory svg .point {
      stroke: var(--background);
      stroke-width: 1.5;
    }
    #vlaGpuMemory svg .value-label {
      font-size: 11px;
      fill: var(--foreground);
    }
    #vlaGpuMemory svg .recommendation {
      font-size: 12px;
      fill: var(--foreground);
    }
    #vlaGpuMemory .recommendations {
      display: none;
    }
    @media (max-width: 599px) {
      #vlaGpuMemory .recommendations {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 3px 12px;
        margin-top: 4px;
      }
      #vlaGpuMemory .recommendations div {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        border-top: 1px solid var(--border);
        padding-top: 4px;
      }
      #vlaGpuMemory .recommendations strong {
        font-weight: 500;
        text-align: right;
      }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script>
    (() => {
      const root = document.getElementById("vlaGpuMemory");
      const svg = d3.select(root.querySelector("svg"));
      const status = root.querySelector("#vlaMemoryStatus");
      const active = { infer: true, lora: true, official: true, full: true };
      const colors = {
        infer: "var(--viz-series-1)",
        lora: "var(--viz-series-2)",
        official: "var(--viz-series-3)",
        full: "var(--viz-series-4)"
      };
      const modeNames = {
        infer: "推理 / 使用",
        lora: "LoRA / PEFT",
        official: "常规 / 官方微调",
        full: "全参微调"
      };
      const models = [
        {
          name: "ACT",
          lines: ["ACT"],
          recommendation: "4090（24GB）已足够",
          infer: { lo: 1, hi: 2, label: "≈1–2" },
          lora: null,
          official: { lo: 2, hi: 6, label: "2–6" },
          full: { lo: 2, hi: 6, label: "2–6" }
        },
        {
          name: "SmolVLA",
          lines: ["SmolVLA"],
          recommendation: "4090（24GB）",
          infer: { lo: 4, hi: 8, label: "≈4–8" },
          lora: { lo: 6, hi: 12, label: "≈6–12" },
          official: { lo: 10, hi: 16, label: "10–16" },
          full: { lo: 12, hi: 20, label: "≈12–20" }
        },
        {
          name: "π0.5",
          lines: ["π0.5"],
          recommendation: "80GB+",
          infer: { lo: 8, hi: 24, label: ">8；建议 16–24", openStart: true },
          lora: { lo: 22.5, hi: 110, label: ">22.5", openRight: true },
          official: { lo: 24, hi: 40, label: "24–40" },
          full: { lo: 70, hi: 110, label: ">70", openRight: true }
        },
        {
          name: "LingBot-VLA 2.0",
          lines: ["LingBot-VLA", "2.0"],
          recommendation: "4×80/96GB",
          infer: { lo: 20, hi: 30, label: "≈20–30" },
          lora: { lo: 32, hi: 48, label: "≈32–48*" },
          official: { lo: 49, hi: 49, label: "≈49 / 卡", point: true },
          full: { lo: 48, hi: 96, label: "48 起 → 80/96 舒适", openStart: true }
        },
        {
          name: "π0.7",
          lines: ["π0.7"],
          recommendation: "暂不采购",
          infer: null,
          lora: null,
          official: null,
          full: null
        },
        {
          name: "宇树 UniFoLM-VLA-0",
          lines: ["UniFoLM", "VLA-0"],
          recommendation: "4×80/96GB（推理 48GB）",
          infer: { lo: 24, hi: 48, label: "24 勉强 → 48 推荐" },
          lora: { lo: 32, hi: 48, label: "≈32–48*" },
          official: { lo: 48, hi: 80, label: "≈48–80*" },
          full: { lo: 80, hi: 80, label: "4×80 / 卡", point: true }
        }
      ];
      const refs = [1, 2, 4, 6, 8, 10, 12, 16, 20, 22.5, 24, 30, 32, 40, 48, 49, 70, 80, 96];
      const xMax = Math.ceil((d3.max(refs) * 1.08) / 10) * 10;

      function render() {
        const width = Math.max(root.querySelector(".chart-wrap").clientWidth || 736, 320);
        const narrow = width < 600;
        const left = narrow ? 82 : 120;
        const right = narrow ? 12 : 178;
        const top = 30;
        const rowHeight = 66;
        const plotBottom = top + models.length * rowHeight - 8;
        const bottom = 44;
        const height = plotBottom + bottom;
        const plotRight = width - right;
        const x = d3.scaleLinear().domain([0, xMax]).range([left, plotRight]);
        const barHeight = 8;

        svg.attr("viewBox", `0 0 ${width} ${height}`);
        svg.selectAll("*").remove();
        const title = svg.append("title").text("VLA 模型单卡显存需求与 GPU 建议");
        svg.append("desc").text("横轴为单卡显存 GB；每个模型按推理、LoRA、常规微调和全参微调显示区间，π0.7 未给出数据。");

        const frame = svg.append("g");
        frame.append("rect")
          .attr("data-chart-frame", "true")
          .attr("x", left)
          .attr("y", top - 10)
          .attr("width", Math.max(0, plotRight - left))
          .attr("height", plotBottom - top + 10);

        const tickValues = narrow ? [0, 50, 100] : [0, 20, 40, 60, 80, 100];
        frame.append("g")
          .attr("class", "grid")
          .selectAll("line")
          .data(tickValues.filter(v => v <= xMax))
          .join("line")
          .attr("x1", d => x(d)).attr("x2", d => x(d))
          .attr("y1", top - 10).attr("y2", plotBottom);

        const axis = frame.append("g")
          .attr("class", "axis")
          .attr("transform", `translate(0,${plotBottom})`)
          .call(d3.axisBottom(x).tickValues(tickValues.filter(v => v <= xMax)).tickFormat(d => `${d}`));
        axis.selectAll("text").attr("fill", "var(--muted-foreground)");
        axis.selectAll("path,line").attr("stroke", "var(--border)");
        frame.append("text")
          .attr("class", "axis-title")
          .attr("data-axis", "x")
          .attr("x", (left + plotRight) / 2)
          .attr("y", height - 7)
          .attr("text-anchor", "middle")
          .text("单卡显存 / GB");
        frame.append("text")
          .attr("class", "axis-title")
          .attr("data-axis", "y")
          .attr("transform", `translate(14 ${(top + plotBottom) / 2}) rotate(-90)`)
          .attr("text-anchor", "middle")
          .text("模型");

        const row = frame.append("g").selectAll("g.model-row")
          .data(models)
          .join("g")
          .attr("class", "model-row")
          .attr("transform", (_, i) => `translate(0,${top + i * rowHeight})`);

        row.each(function(model) {
          const g = d3.select(this);
          const rowIndex = models.indexOf(model);
          const label = g.append("text")
            .attr("class", "model-label")
            .attr("x", left - 10)
            .attr("text-anchor", "end");
          const lines = model.lines;
          const startY = 33 - (lines.length - 1) * 7;
          lines.forEach((line, i) => label.append("tspan").attr("x", left - 10).attr("y", startY + i * 14).text(line));

          if (!model.infer && !model.lora && !model.official && !model.full) {
            g.append("text").attr("class", "value-label").attr("x", left + 6).attr("y", 35).text("数据未给出；暂缓采购");
          }

          ["infer", "lora", "official", "full"].forEach((mode, modeIndex) => {
            if (!active[mode]) return;
            const item = model[mode];
            const y = 8 + modeIndex * 12;
            if (!item) {
              g.append("text").attr("class", "mode-label").attr("x", left + 4).attr("y", y + 8).text("—");
              return;
            }
            const x0 = x(Math.max(0, item.lo));
            const x1 = x(Math.min(xMax, item.hi));
            const tooltip = `${model.name}｜${modeNames[mode]}：${item.label} GB`;
            if (item.point || item.lo === item.hi) {
              g.append("circle")
                .attr("class", "point")
                .attr("cx", x0)
                .attr("cy", y + barHeight / 2)
                .attr("r", 4)
                .attr("fill", colors[mode])
                .attr("data-tooltip", tooltip);
            } else {
              g.append("rect")
                .attr("class", `bar${item.openRight ? " open-right" : ""}`)
                .attr("x", x0)
                .attr("y", y)
                .attr("width", Math.max(1, x1 - x0))
                .attr("height", barHeight)
                .attr("fill", colors[mode])
                .attr("data-tooltip", tooltip);
              if (item.openRight) {
                g.append("path")
                  .attr("class", "open-arrow")
                  .attr("style", `stroke:${colors[mode]}`)
                  .attr("d", `M${plotRight - 8},${y + barHeight / 2 - 3} L${plotRight - 2},${y + barHeight / 2} L${plotRight - 8},${y + barHeight / 2 + 3}`)
                  .attr("data-tooltip", tooltip);
              }
              if (item.openStart) {
                g.append("path")
                  .attr("class", "open-arrow")
                  .attr("style", `stroke:${colors[mode]}`)
                  .attr("d", `M${x0 + 8},${y + barHeight / 2 - 3} L${x0 + 2},${y + barHeight / 2} L${x0 + 8},${y + barHeight / 2 + 3}`)
                  .attr("data-tooltip", tooltip);
              }
            }
            const nearRight = x1 > plotRight - 84;
            g.append("text")
              .attr("class", "value-label")
              .attr("x", nearRight ? plotRight - 4 : x1 + 5)
              .attr("y", y + 8)
              .attr("text-anchor", nearRight ? "end" : "start")
              .text(item.label);
          });

          if (!narrow) {
            g.append("text")
              .attr("class", "recommendation")
              .attr("x", plotRight + 14)
              .attr("y", 35)
              .text(model.recommendation);
          }
        });

        frame.append("text")
          .attr("class", "mode-label")
          .attr("x", left)
          .attr("y", top - 16)
          .text("估算区间 / 单卡");
        if (!narrow) {
          frame.append("text")
            .attr("class", "mode-label")
            .attr("x", plotRight + 14)
            .attr("y", top - 16)
            .text("推荐 GPU");
        }
      }

      root.querySelectorAll(".viz-controls button").forEach(button => {
        button.addEventListener("click", () => {
          const mode = button.dataset.mode;
          active[mode] = !active[mode];
          button.setAttribute("aria-pressed", String(active[mode]));
          const visible = Object.keys(active).filter(key => active[key]).map(key => modeNames[key]);
          status.textContent = visible.length ? `当前显示：${visible.join("、")}。` : "当前未显示任何阶段。";
          render();
        });
      });

      const observer = new ResizeObserver(render);
      observer.observe(root.querySelector(".chart-wrap"));
      render();
    })();
  </script>
</div>
