    return el('polyline', { points:pts, class:klass || '', fill:'none' });
  }
  function drawGrid(b, fit) {
    const frame = el('rect', { x:35, y:28, width:830, height:455, class:'scene-frame' });
    add(frame);
    const origin = [0,0,0];
    [-0.2,0.2].forEach((x) => add(line(project([x,-0.6,0],b,fit), project([x,0.6,0],b,fit), 'scene-grid')));
    [-0.2,0.2].forEach((y) => add(line(project([-0.6,y,0],b,fit), project([0.6,y,0],b,fit), 'scene-grid')));
    const label = el('text', { x:48, y:48, class:'scene-muted' });
    label.textContent = state.view === 'top' ? '俯视：XY' : (state.view === 'front' ? '正视：XZ' : '可拖动的 3D 投影');
    add(label);
    const o = project(origin,b,fit);
    const axes = [
      {p:[.16,0,0], text:'+X', c:'var(--viz-series-2)'},
      {p:[0,.16,0], text:'+Y', c:'var(--viz-series-3)'},
      {p:[0,0,.16], text:'+Z', c:'var(--viz-series-5)'}
    ];
    axes.forEach((a) => {
      const q = project(a.p,b,fit);
      add(line(o,q,'scene-grid',{stroke:a.c,opacity:.85,'stroke-width':2}));
      const t = el('text',{x:q[0]+4,y:q[1]-4,class:'scene-axis'});
      t.textContent = 'base '+a.text; add(t);
    });
  }
  function drawPoints(points, classes, radius, opacity, b, fit, order) {
    (order || points.map((_,i)=>i)).forEach((i) => {
      const p = project(points[i],b,fit);
      const c = el('circle', { cx:p[0], cy:p[1], r:radius, fill:classes[i] || classes, opacity:opacity });
      add(c);
    });
  }
  function drawLinks(points, b, fit, klass, limit) {
    for (let i=0; i<Math.min(points.length, limit*2); i+=2) {
      add(line(project(points[i],b,fit), project(points[i+1],b,fit), klass));
    }
  }
  function drawBox(box, b, fit, klass) {
    edges.forEach((e) => add(line(project(box[e[0]],b,fit), project(box[e[1]],b,fit), 'scene-box '+klass)));
  }
  function updateButtons(selector, value) {
    root.querySelectorAll(selector).forEach((button) => button.setAttribute('aria-pressed', button.getAttribute(selector.includes('stage') ? 'data-stage' : 'data-view') === value ? 'true' : 'false'));
  }
  function render() {
    draw.replaceChildren();
    const b = basis();
    const objects = [D.obsLocal, D.boxF, D.boxI];
    if (state.stage !== 'initial') objects.push(D.final);
    if (state.stage !== 'fit') objects.push(D.initial);
    const fit = projectionFit(objects, b);
    drawGrid(b,fit);

    const obsOrder = [];
    for (let i=0;i<D.obsLocal.length;i++) if (!D.obsLocalInlier[i]) obsOrder.push(i);
    for (let i=0;i<D.obsLocal.length;i++) if (D.obsLocalInlier[i]) obsOrder.push(i);
    drawPoints(D.obsLocal, D.obsLocalInlier.map((v)=>v ? 'var(--viz-series-2)' : 'var(--muted-foreground)'), 1.35, 0.58, b, fit, obsOrder);

    if (state.stage === 'compare' || state.stage === 'initial') {
      drawLinks(D.linksI,b,fit,'scene-link initial',DATA.linksInitial.n);
      drawBox(D.boxI,b,fit,'initial');
      drawPoints(D.initial,D.iRoles.map(()=> 'var(--viz-series-4)'),1.25,state.stage === 'compare' ? 0.24 : 0.92,b,fit);
    }
    if (state.stage === 'compare' || state.stage === 'fit') {
      drawLinks(D.linksF,b,fit,'scene-link',DATA.linksFinal.n);
      drawBox(D.boxF,b,fit,'final');
      const meshColors = D.fRoles.map((r)=>roleColors[r] || roleColors[3]);
      drawPoints(D.final,meshColors,1.65,state.stage === 'compare' ? 0.95 : 0.96,b,fit);
    }

    const center = project([0,0,0],b,fit);
    const cam = project(D.camera,b,fit);
    add(line(cam,center,'scene-link',{opacity:.22,'stroke-dasharray':'4 4'}));
    add(el('circle',{cx:cam[0],cy:cam[1],r:6,class:'scene-camera'}));
    const ct=el('text',{x:cam[0]+8,y:cam[1]-8,class:'scene-muted'}); ct.textContent='相机'; add(ct);
    const mt=el('text',{x:center[0]+8,y:center[1]-8,class:'scene-axis'}); mt.textContent='估计中心'; add(mt);

    const pose = state.stage === 'initial' ? DATA.poseInitial : DATA.poseFinal;
    const dYaw = canonicalDelta(DATA.poseFinal[3], DATA.poseInitial[3]);
    const poseName = state.stage === 'initial' ? 'ROI q0' : 'R1 拟合';
    const status = state.stage === 'initial' ? '初值' : 'accepted geometry candidate';
    resultLine.textContent = poseName+' · '+status+' · center base_link = ('+fmt(pose[0],3)+', '+fmt(pose[1],3)+', '+fmt(pose[2],3)+') m · yaw = '+fmt(deg(pose[3]),1)+'°；q0→拟合 Δ = ('+fmt((DATA.poseFinal[0]-DATA.poseInitial[0])*1000,0)+', '+fmt((DATA.poseFinal[1]-DATA.poseInitial[1])*1000,0)+', '+fmt((DATA.poseFinal[2]-DATA.poseInitial[2])*1000,0)+') mm, Δyaw = '+fmt(deg(dYaw),1)+'°。'+(state.stage === 'initial' ? '' : ' 姿态门禁通过，但 accuracy_validated=false、grasp_ready=false。');
  }
  root.querySelectorAll('[data-stage]').forEach((button) => button.addEventListener('click', () => {
    state.stage = button.getAttribute('data-stage');
    root.querySelectorAll('[data-stage]').forEach((b) => b.setAttribute('aria-pressed', b === button ? 'true' : 'false'));
    render();
  }));
  root.querySelectorAll('[data-view]').forEach((button) => button.addEventListener('click', () => {
    state.view = button.getAttribute('data-view');
    root.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', b === button ? 'true' : 'false'));
    render();
  }));
  svg.addEventListener('pointerdown', (event) => {
    if (state.view !== 'oblique') return;
    state.dragging = true; state.px = event.clientX; state.py = event.clientY;
    svg.setPointerCapture(event.pointerId);
  });
  svg.addEventListener('pointermove', (event) => {
    if (!state.dragging) return;
    state.az += (event.clientX-state.px)*0.008;
    state.el = Math.max(-1.05, Math.min(1.05, state.el+(event.clientY-state.py)*0.008));
    state.px = event.clientX; state.py = event.clientY; render();
  });
  svg.addEventListener('pointerup', () => { state.dragging=false; });
  svg.addEventListener('pointercancel', () => { state.dragging=false; });
  render();
})();
</script>
</div>
