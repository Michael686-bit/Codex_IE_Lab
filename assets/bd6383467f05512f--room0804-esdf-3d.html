  const sliceZ = [0.35, 0.60, 1.00];
  const sliceWidth = 61;
  const sliceHeight = 61;
  const origin = [-3.8, -6.65, -0.55];
  const resolution = 0.05;

  function decodeBase64(value) {
    const binary = atob(value);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  const pointBytes = decodeBase64(packedPoints);
  const pointView = new DataView(pointBytes.buffer);
  const points = new Array(pointCount);
  for (let i = 0; i < pointCount; i += 1) {
    const offset = i * 6;
    points[i] = [
      origin[0] + resolution * pointView.getUint16(offset, true),
      origin[1] + resolution * pointView.getUint16(offset + 2, true),
      origin[2] + resolution * pointView.getUint16(offset + 4, true)
    ];
  }

  const sliceBytes = decodeBase64(packedSlices);
  const sliceView = new DataView(sliceBytes.buffer);
  const routeStart = [0.417078, -0.100370, -0.021889];
  const routeGoal = [0.407122, -1.100310, -0.025123];
  const sphereCenter = [0.514353, -0.867357, 0.358061];
  const nearestStatic = [-0.65, -0.30, 0.55];
  let yaw = -0.72;
  let pitch = 0.88;
  let zoom = 1;
  let dragging = false;
  let lastPointer = null;

  function theme(name) {
    return getComputedStyle(root).getPropertyValue(name).trim();
  }

  function project(point, center, scale, width, height) {
    const x = point[0] - center[0];
    const y = point[1] - center[1];
    const z = point[2] - center[2];
    const cy = Math.cos(yaw);
    const sy = Math.sin(yaw);
    const cp = Math.cos(pitch);
    const sp = Math.sin(pitch);
    const a = cy * x - sy * y;
    const b = sy * x + cy * y;
    const c = z;
    const vertical = sp * b + cp * c;
    const depth = cp * b - sp * c;
    return [width / 2 + a * scale, height / 2 - vertical * scale, depth];
  }

  function drawLine(first, second, color, lineWidth, center, scale, width, height) {
    const a = project(first, center, scale, width, height);
    const b = project(second, center, scale, width, height);
    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth;
    ctx.beginPath();
    ctx.moveTo(a[0], a[1]);
    ctx.lineTo(b[0], b[1]);
    ctx.stroke();
  }

  function drawMarker(point, radius, color, center, scale, width, height) {
    const p = project(point, center, scale, width, height);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(p[0], p[1], radius, 0, Math.PI * 2);
    ctx.fill();
  }

  function draw() {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    const width = Math.max(320, rect.width);
    const height = rect.height;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, width, height);

    const local = viewControl.value === 'local';
    const center = local ? [0.25, -0.65, 0.65] : [13.1, -1.15, 1.0];
    const baseScale = local ? Math.min(width / 4.5, height / 3.5) : Math.min(width / 35.5, height / 12.5);
    const scale = baseScale * zoom;
    const foreground = theme('--foreground');
    const muted = theme('--muted-foreground');
    const border = theme('--border');
    const routeColor = theme('--viz-series-1');
    const nearestColor = theme('--viz-series-2');
    const nearColor = theme('--viz-series-3');
    const mediumColor = theme('--viz-series-4');
    const destructive = theme('--destructive');

    ctx.globalAlpha = 0.65;
    for (let gx = local ? -1 : -5; gx <= (local ? 2 : 30); gx += local ? 0.5 : 5) {
      drawLine([gx, local ? -2 : -6.5, 0], [gx, local ? 1 : 4, 0], border, 1, center, scale, width, height);
    }
    for (let gy = local ? -2 : -6; gy <= (local ? 1 : 4); gy += local ? 0.5 : 2) {
      drawLine([local ? -1 : -3.5, gy, 0], [local ? 2 : 30, gy, 0], border, 1, center, scale, width, height);
    }
    ctx.globalAlpha = 1;

    if (distanceControl.checked && local) {
      const sliceIndex = Number(sliceControl.value);
      const z = sliceZ[sliceIndex];
      const sliceOffset = sliceIndex * sliceWidth * sliceHeight * 2;
      const dots = [];
      for (let iy = 0; iy < sliceHeight; iy += 1) {
        for (let ix = 0; ix < sliceWidth; ix += 1) {
          const cell = iy * sliceWidth + ix;
          const distance = sliceView.getUint16(sliceOffset + cell * 2, true) / 1000;
          const world = [-1 + ix * 0.05, -2 + iy * 0.05, z];
          const projected = project(world, center, scale, width, height);
          dots.push([projected, distance]);
        }
      }
      dots.sort((a, b) => a[0][2] - b[0][2]);
      ctx.globalAlpha = 0.42;
      for (const item of dots) {
        const distance = item[1];
        ctx.fillStyle = distance < 0.17 ? destructive : distance < 0.30 ? nearColor : distance < 0.60 ? mediumColor : muted;
        ctx.fillRect(item[0][0] - 2, item[0][1] - 2, 4, 4);
      }
      ctx.globalAlpha = 1;
    }

    if (pointsControl.checked) {
      const visible = [];
      for (const point of points) {
        if (local && (point[0] < -1.2 || point[0] > 2.2 || point[1] < -2.3 || point[1] > 1.3 || point[2] > 1.8)) continue;
        visible.push([project(point, center, scale, width, height), point]);
      }
      visible.sort((a, b) => a[0][2] - b[0][2]);
      ctx.fillStyle = foreground;
      ctx.globalAlpha = local ? 0.72 : 0.48;
      const radius = local ? 1.8 : 1.1;
      for (const item of visible) ctx.fillRect(item[0][0] - radius, item[0][1] - radius, radius * 2, radius * 2);
      ctx.globalAlpha = 1;
    }

    drawLine(routeStart, routeGoal, routeColor, 4, center, scale, width, height);
    drawMarker(routeStart, 6, routeColor, center, scale, width, height);
    drawMarker(routeGoal, 6, destructive, center, scale, width, height);
    drawLine(sphereCenter, nearestStatic, nearestColor, 2, center, scale, width, height);
    drawMarker(nearestStatic, 5, nearestColor, center, scale, width, height);
    const sphere = project(sphereCenter, center, scale, width, height);
    ctx.strokeStyle = destructive;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(sphere[0], sphere[1], Math.max(5, 0.17 * scale), 0, Math.PI * 2);
    ctx.stroke();
    drawMarker(sphereCenter, 4, destructive, center, scale, width, height);

    drawLine([-0.9, -1.85, 0], [-0.4, -1.85, 0], routeColor, 3, center, scale, width, height);
    drawLine([-0.9, -1.85, 0], [-0.9, -1.35, 0], nearestColor, 3, center, scale, width, height);
    drawLine([-0.9, -1.85, 0], [-0.9, -1.85, 0.5], destructive, 3, center, scale, width, height);
    status.textContent = (local ? '失败区域' : '完整静态地图') + ' · 占据体素 ' + pointCount.toLocaleString() + ' 个采样 · 拖动旋转 · 滚轮缩放';
  }

  canvas.addEventListener('pointerdown', event => {
    dragging = true;
    lastPointer = [event.clientX, event.clientY];
    canvas.setPointerCapture(event.pointerId);
  });
  canvas.addEventListener('pointermove', event => {
    if (!dragging || !lastPointer) return;
    yaw += (event.clientX - lastPointer[0]) * 0.008;
    pitch = Math.max(0.08, Math.min(1.48, pitch + (event.clientY - lastPointer[1]) * 0.008));
    lastPointer = [event.clientX, event.clientY];
    draw();
  });
  canvas.addEventListener('pointerup', () => { dragging = false; lastPointer = null; });
  canvas.addEventListener('wheel', event => {
    event.preventDefault();
    zoom = Math.max(0.55, Math.min(3.5, zoom * Math.exp(-event.deltaY * 0.001)));
    draw();
  }, { passive: false });

  [viewControl, sliceControl, pointsControl, distanceControl].forEach(control => control.addEventListener('change', draw));
  resetButton.addEventListener('click', () => { yaw = -0.72; pitch = 0.88; zoom = 1; draw(); });
  new ResizeObserver(draw).observe(canvas);
  new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ['class', 'style'] });
  draw();
})();
</script>
